<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f5f8b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vessel Inspection">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vessel & Crew Inspection</title>
<style>

:root{
  --bg:#f4f6f8;--panel:#fff;--line:#d9dee5;--text:#17202a;--muted:#66727f;
  --accent:#1f5f8b;--accent2:#eaf3f9;--danger:#a52a2a;--ok:#27734d;--warn:#9a6b00;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.topbar .title{font-weight:700;margin-right:auto}
.btn{border:1px solid #b9c3cd;background:#fff;border-radius:7px;padding:8px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 58px)}
.sidebar{border-right:1px solid var(--line);background:#fff;padding:12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:6px;margin-bottom:3px}
 .navbtn:hover,.navbtn.active{background:var(--accent2);color:var(--accent);font-weight:600}
.navbtn-inner{display:flex;align-items:center;gap:6px;width:100%}.navbtn-label{flex:1;min-width:0}.nav-section-state{font-size:12px;font-weight:700;min-width:18px;text-align:center}.nav-section-state.done{color:var(--ok)}.nav-section-state.attention{color:var(--warn)}.nav-section-state.none{color:#9aa3ad}.nav-section-state.na{color:#6b7280}.nav-summary{margin-top:12px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fafbfc;line-height:1.55}.section-control{display:flex;align-items:center;gap:10px;margin-left:auto}.section-control label{font-size:12px;color:var(--muted);font-weight:600}.section-control select{border:1px solid #cbd3db;border-radius:6px;padding:7px;background:#fff;font-weight:600}.section-na-notice{padding:14px;background:#f5f6f8;border:1px solid var(--line);border-radius:8px;color:var(--muted);margin-top:14px}
.content{padding:18px;max-width:1500px;width:100%;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h1,h2,h3{margin-top:0}
h2{font-size:21px}
h3{font-size:16px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid #cbd3db;border-radius:6px;padding:8px;background:#fff}
.field textarea{min-height:74px;resize:vertical}
.section-head{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.section-head .section-no{font-size:13px;color:var(--muted);font-weight:700}
.item{border:1px solid var(--line);border-radius:9px;margin:12px 0;background:#fff;overflow:hidden}
.item-head{padding:12px;background:#fafbfc;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item-id{font-weight:700;min-width:42px;color:var(--accent)}
.item-title{font-weight:650;flex:1}
.status{min-width:160px}
.item-body{padding:12px}
.guidance{background:#f3f7fa;border-left:4px solid var(--accent);padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.45}
.guidance b{color:var(--accent)}
.item-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-fields .full{grid-column:1/-1}
.photo-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photos-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.photo-edit{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fafbfc}
.photo-edit img{width:100%;height:160px;object-fit:contain;background:#eef1f4;border-radius:5px}
.photo-meta{display:grid;gap:6px;margin-top:7px}
.photo-meta input,.photo-meta select{width:100%;padding:6px;border:1px solid #cbd3db;border-radius:5px}
.small{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#e7ebef;border-radius:20px;overflow:hidden;margin:7px 0 4px}
.progress>div{height:100%;background:var(--accent);width:0}
.badge{display:inline-block;padding:3px 7px;border-radius:20px;font-size:11px;border:1px solid var(--line)}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--danger)}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--line);padding:7px;vertical-align:top;font-size:12px}
th{background:#f2f4f6;text-align:left}
.notice{padding:10px 12px;background:#fff8df;border:1px solid #ead58b;border-radius:7px;font-size:13px;margin-bottom:12px}
.offline-status{font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px;border:1px solid #cbd3db;background:#f7fafc;color:var(--muted);white-space:nowrap}
.offline-status.online{color:var(--ok);border-color:#9ac8ae;background:#f2faf5}
.offline-status.offline{color:var(--warn);border-color:#dfc477;background:#fff9e8}
.offline-status.ready{color:var(--ok);border-color:#9ac8ae;background:#f2faf5}

.reference-suggestion{margin-top:6px;padding:7px 9px;border:1px solid #cbd3db;border-radius:6px;background:#f7fafc;font-size:12px;color:var(--muted)}
.reference-suggestion strong{color:var(--accent)}
.reference-library-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.reference-library-entry{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;margin-bottom:10px}
.reference-library-entry .ref-head{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:start}
.reference-library-entry textarea{min-height:58px}
.reference-match{font-size:11px;color:var(--muted);margin-top:4px}
@media(max-width:950px){.reference-library-entry .ref-head{grid-template-columns:1fr}}
.cover-photo{max-width:360px;border:1px solid var(--line);padding:6px;border-radius:8px}
.cover-photo img{display:block;width:100%;height:220px;object-fit:contain;background:#eef1f4}
.start-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.start-box{max-width:620px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px}
.hidden{display:none!important}
.no-print{}
.print-ready{display:block!important}
.print-only{display:none}.report-page,.report-page-header,.report-page-footer{display:none}
.photo-pages{margin-top:15px}
.photo-page{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5mm;height:277mm;break-after:page;page-break-after:always}
.photo-card{border:1px solid #bfc6cd;padding:4mm;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.photo-card .photo-image{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.photo-card img{width:100%;height:100%;object-fit:contain;display:block}
.photo-caption{font-size:9pt;line-height:1.25;margin-top:2mm}
.photo-caption strong{font-weight:700}
.section-print{break-before:page;page-break-before:always}
.section-print:first-child{break-before:auto;page-break-before:auto}
.print-table td,.print-table th{font-size:8.5pt}
.report-photo-title{font-size:14pt;font-weight:700;margin:7mm 0 4mm}
@media(max-width:950px){
  .layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .grid2,.grid3,.item-fields{grid-template-columns:1fr}
  .status{min-width:0;width:100%}
  .item-head{flex-wrap:wrap}
}



.cover-vessel-photo-wrap{margin:3mm 0 3mm;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.cover-vessel-photo-title{font-weight:700;font-size:8pt;margin-bottom:2mm}
.cover-vessel-photo{border:0.3mm solid #777;display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;flex:0 0 auto}
.cover-vessel-photo.portrait{width:63.64mm;height:90mm}
.cover-vessel-photo.landscape{width:127.28mm;height:90mm}
.cover-vessel-photo.auto{width:127.28mm;height:90mm}
.cover-vessel-photo img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{margin:0!important;padding:0!important;width:210mm!important;background:#fff!important;color:#000!important}
  body{font-family:Arial,Helvetica,sans-serif!important}
  .no-print,.topbar,.sidebar,.guidance,.statuses,.start-screen,.photo-toolbar,.screen-only,#screen{display:none!important}
  .print-only{display:block!important}
/* QHSE header/footer are generated only inside the print report.
     They are normal-flow elements inside every physical A4 page.
     Nothing is displayed in the browser inspection interface. */
  #printReport{display:block!important;width:210mm!important;max-width:none!important;margin:0!important;padding:0!important}
  #printReport>div{display:block!important;width:210mm!important;margin:0!important;padding:0!important}
  .report-page{
    display:grid!important;
    grid-template-rows:14mm 1fr 11mm!important;
    width:210mm!important;
    height:297mm!important;
    min-height:297mm!important;
    max-height:297mm!important;
    box-sizing:border-box!important;
    margin:0!important;
    padding:0!important;
    overflow:hidden!important;
    background:#fff!important;
    break-after:page!important;
    page-break-after:always!important;
    break-inside:avoid!important;
    page-break-inside:avoid!important;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }
  .report-page:last-child{break-after:auto!important;page-break-after:auto!important}
  .report-page-header{
    display:flex!important;
    width:210mm!important;
    height:14mm!important;
    box-sizing:border-box!important;
    padding:2mm 8mm 1.5mm!important;
    background:#fff!important;
    border-bottom:.25mm solid #555!important;
    align-items:center!important;
    justify-content:flex-start!important;
    overflow:hidden!important;
  }
  .report-page-header .report-header-name{
    display:block!important;
    font-family:Arial,Helvetica,sans-serif!important;
    font-size:11pt!important;
    line-height:1!important;
    font-weight:700!important;
    letter-spacing:.2mm!important;
    color:#111!important;
    white-space:nowrap!important;
  }
  .report-page-header .report-header-title{display:none!important}
  .report-page-body{
    display:block!important;
    width:194mm!important;
    height:auto!important;
    min-height:0!important;
    box-sizing:border-box!important;
    margin:0 8mm!important;
    padding:0!important;
    overflow:hidden!important;
  }
  .report-page-footer{
    display:flex!important;
    width:210mm!important;
    height:11mm!important;
    box-sizing:border-box!important;
    padding:1.5mm 8mm!important;
    margin:0!important;
    background:#fff!important;
    border-top:.25mm solid #555!important;
    align-items:center!important;
    justify-content:space-between!important;
    font:7pt/1.15 Arial,Helvetica,sans-serif!important;
    color:#111!important;
    overflow:hidden!important;
  }
  .report-footer-left{
    display:flex!important;
    flex-direction:column!important;
    gap:.5mm!important;
  }
  .report-footer-code{font-weight:700!important}
  .report-footer-note{font-size:6.5pt!important;font-style:italic!important}
  .report-footer-page{font-weight:700!important;white-space:nowrap!important}
  .layout,.content{display:block!important;width:210mm!important;max-width:none!important;margin:0!important;padding:0!important}
  .section-print{display:block!important;width:194mm!important;box-sizing:border-box!important;margin:0!important;padding:4mm 0 3mm!important;break-before:auto!important;page-break-before:auto!important;break-inside:auto!important;page-break-inside:auto!important;overflow:visible!important}
  .section-print:first-child{break-before:auto!important;page-break-before:auto!important}
  .print-section-header{border-bottom:1px solid #000!important;padding-bottom:3mm!important;margin-bottom:4mm!important}
  .print-section-header h2{margin:0!important;padding:0!important;text-align:left!important}
  .print-table{display:table!important;width:194mm!important;margin:0!important;border-collapse:collapse!important;table-layout:auto!important}
  .print-table th,.print-table td{box-sizing:border-box!important;border:1px solid #555!important;padding:1.5mm!important;font-size:11.0pt!important;line-height:1.15!important;vertical-align:top!important;overflow-wrap:break-word!important;word-break:normal!important;white-space:normal!important}
  .print-table th{font-size:12.0pt!important}
  /* Section checklist: N is only for numbering; Item is medium; Comments/Findings gets the main width. */
  .section-checklist-table{table-layout:auto!important}
  .section-checklist-table th:nth-child(1),.section-checklist-table td:nth-child(1){width:7mm!important;min-width:7mm!important;max-width:10mm!important;text-align:center!important;white-space:nowrap!important}
  .section-checklist-table th:nth-child(2),.section-checklist-table td:nth-child(2){width:31%!important;min-width:48mm!important}
  .section-checklist-table th:nth-child(3),.section-checklist-table td:nth-child(3){width:calc(69% - 7mm)!important;min-width:95mm!important}
  .section-checklist-table tr{break-inside:avoid!important;page-break-inside:avoid!important}
  /* Photo pages are already wrapped in a self-contained A4 .report-page.
     Do not force another page break inside that page: doing so creates blank
     physical pages in Safari/WebKit. Keep the photo sheet inside the printable
     body area reserved between the QHSE header and footer. */
  .section-photo-block{display:block!important;position:relative!important;width:194mm!important;height:272mm!important;margin:0!important;padding:0!important;break-before:auto!important;page-break-before:auto!important;break-after:auto!important;page-break-after:auto!important;break-inside:avoid!important;page-break-inside:avoid!important;overflow:hidden!important}
  .photo-sheet{position:relative!important;display:block!important;width:194mm!important;height:272mm!important;margin:0!important;padding:0!important;overflow:hidden!important}
  .photo-card-abs{position:absolute!important;display:flex!important;flex-direction:column!important;box-sizing:border-box!important;border:.3mm solid #777!important;padding:3mm!important;margin:0!important;overflow:hidden!important;background:#fff!important;break-inside:avoid!important;page-break-inside:avoid!important}
  /* Reserve a fixed caption area inside every photo card so the caption of the
     lower row is never pushed into / hidden by the report footer. */
  .photo-image-abs{width:100%!important;height:calc(100% - 24mm)!important;min-height:0!important;flex:0 0 calc(100% - 24mm)!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important}
  .photo-image-abs img{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important;object-position:center center!important}
  .photo-caption-abs{width:100%!important;height:21mm!important;min-height:21mm!important;max-height:21mm!important;box-sizing:border-box!important;overflow:hidden!important;font:6.5pt/1.12 Arial,Helvetica,sans-serif!important;margin:2mm 0 0 0!important;padding:0!important}
  .report-photo-title{display:none!important}
  /* Final findings/recommendations: keep this as one continuous table layout.
     The JavaScript paginates rows explicitly; CSS must not turn each row into
     a separate physical page. */
  .final-recommendations-table{table-layout:fixed!important;width:194mm!important}
  .final-recommendations-table th,.final-recommendations-table td{font-size:7.5pt!important;line-height:1.08!important;padding:1.1mm!important;vertical-align:top!important;overflow-wrap:anywhere!important;word-break:normal!important}
  .final-recommendations-table th:nth-child(1),.final-recommendations-table td:nth-child(1){width:7mm!important;text-align:center!important}
  .final-recommendations-table th:nth-child(2),.final-recommendations-table td:nth-child(2){width:32mm!important}
  .final-recommendations-table th:nth-child(3),.final-recommendations-table td:nth-child(3){width:36mm!important}
  .final-recommendations-table th:nth-child(4),.final-recommendations-table td:nth-child(4){width:24mm!important}
  .final-recommendations-table th:nth-child(5),.final-recommendations-table td:nth-child(5){width:38mm!important}
  .final-recommendations-table th:nth-child(6),.final-recommendations-table td:nth-child(6){width:18mm!important}
  .final-recommendations-table th:nth-child(7),.final-recommendations-table td:nth-child(7){width:39mm!important}
  .final-recommendations-table thead{display:table-header-group!important}
  .final-recommendations-table tbody tr{break-inside:avoid!important;page-break-inside:avoid!important}

  /* ---------- Report page 1 / INSPECTION SUMMARY ---------- */
  .report-page.cover-report-page{
    grid-template-rows:1fr 11mm!important;
  }
  .report-page.cover-report-page .report-page-body{
    width:194mm!important;
    margin:0 8mm!important;
    padding:0!important;
    overflow:hidden!important;
  }
  .inspection-summary-cover{
    width:194mm!important;
    height:282mm!important;
    box-sizing:border-box!important;
    padding:8mm 0 5mm!important;
    overflow:hidden!important;
  }
  .inspection-summary-title{
    margin:0!important;
    padding:0 0 3mm!important;
    border-bottom:.35mm solid #0057A8!important;
    font:700 14pt/1 Arial,Helvetica,sans-serif!important;
    letter-spacing:.2mm!important;
    color:#111!important;
  }
  .inspection-summary-top{
    display:grid!important;
    grid-template-columns:105mm 1fr!important;
    column-gap:8mm!important;
    width:194mm!important;
    margin-top:8mm!important;
    min-height:148mm!important;
    align-items:start!important;
  }
  .inspection-summary-photo{
    width:105mm!important;
    height:148mm!important;
    box-sizing:border-box!important;
    border:.3mm solid #777!important;
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    overflow:hidden!important;
    background:#fff!important;
  }
  .inspection-summary-photo.landscape{
    width:105mm!important;
    height:148mm!important;
  }
  .inspection-summary-photo.portrait{
    width:105mm!important;
    height:148mm!important;
  }
  .inspection-summary-photo img{
    display:block!important;
    width:auto!important;
    height:auto!important;
    max-width:100%!important;
    max-height:100%!important;
    object-fit:contain!important;
  }
  .inspection-summary-photo-empty{
    font:8.5pt/1.2 Arial,Helvetica,sans-serif!important;
    color:#777!important;
    text-align:center!important;
    padding:5mm!important;
  }
  .inspection-summary-facts{
    border-left:.35mm solid #8aaed0!important;
    padding-left:7mm!important;
    box-sizing:border-box!important;
    min-height:105mm!important;
  }
  .summary-fact{
    padding:0 0 6mm!important;
    margin:0 0 6mm!important;
    border-bottom:.25mm solid #9bb9d4!important;
  }
  .summary-fact:last-child{margin-bottom:0!important}
  .summary-fact-label{
    display:block!important;
    margin:0 0 2mm!important;
    font:700 8pt/1.1 Arial,Helvetica,sans-serif!important;
    color:#4f6d8c!important;
    letter-spacing:.15mm!important;
  }
  .summary-fact-value{
    display:block!important;
    font:400 11.5pt/1.15 Arial,Helvetica,sans-serif!important;
    color:#111!important;
    overflow-wrap:anywhere!important;
  }
  .inspection-summary-lower{
    margin-top:8mm!important;
  }
  .summary-text-block{
    margin:0 0 7mm!important;
  }
  .summary-text-heading{
    display:flex!important;
    align-items:baseline!important;
    gap:4mm!important;
    margin:0 0 3mm!important;
    padding:0 0 2mm!important;
    border-bottom:.3mm solid #9bb9d4!important;
  }
  .summary-text-heading span{
    font:700 10pt/1.1 Arial,Helvetica,sans-serif!important;
    color:#111!important;
    letter-spacing:.1mm!important;
  }
  .summary-text{
    font:400 9.5pt/1.35 Arial,Helvetica,sans-serif!important;
    color:#111!important;
    white-space:pre-wrap!important;
    overflow-wrap:break-word!important;
  }

  /* ---------- Report page 2 / VESSEL & CREW INFORMATION ---------- */
  .vessel-crew-info-page{
    width:194mm!important;
    min-height:272mm!important;
    box-sizing:border-box!important;
    padding:5mm 0 3mm!important;
    overflow:hidden!important;
  }
  .report-page-title{
    margin:0!important;
    padding:0 0 3mm!important;
    border-bottom:.35mm solid #0057A8!important;
    font:700 14pt/1 Arial,Helvetica,sans-serif!important;
    letter-spacing:.2mm!important;
    color:#111!important;
  }
  .info-block{
    margin-top:8mm!important;
  }
  .info-block:first-of-type{margin-top:7mm!important}
  .info-block-title{
    margin:0 0 3mm!important;
    padding:0!important;
    font:700 10pt/1.1 Arial,Helvetica,sans-serif!important;
    color:#17395f!important;

/* ---------- IndexedDB v10 ---------- */
function openDB(name=DB_NAME,version=DB_VERSION){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(name,version);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE,{keyPath:"id"});
      if(!db.objectStoreNames.contains(STATE_STORE)) db.createObjectStore(STATE_STORE,{keyPath:"id"});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("IndexedDB open failed"));
  });
}
function openPhotoDB(){
  if(dbPromise)return dbPromise;
  dbPromise=openDB();
  return dbPromise;
}
async function getStateFromDB(db){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STATE_STORE,"readonly");
    const req=tx.objectStore(STATE_STORE).get("current");
    req.onsuccess=()=>resolve(req.result?.state||null);
    req.onerror=()=>reject(req.error);
  });
}
async function getBlobFromDB(db,id){
  if(!id)return null;
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE,"readonly");
    const req=tx.objectStore(PHOTO_STORE).get(id);
    req.onsuccess=()=>resolve(req.result?.blob||null);
    req.onerror=()=>reject(req.error);
  });
}
async function copyLegacyPhotos(oldDb,newDb,sourceState){
  const ids=new Set();
  for(const it of Object.values(sourceState?.items||{})) for(const p of (it.photos||[])) if(p?.id) ids.add(p.id);
  if(sourceState?.meta?.vesselPhoto?.id) ids.add(sourceState.meta.vesselPhoto.id);
  for(const id of ids){
    const blob=await getBlobFromDB(oldDb,id);
    if(blob){
      await new Promise((resolve,reject)=>{
        const tx=newDb.transaction(PHOTO_STORE,"readwrite");
        tx.objectStore(PHOTO_STORE).put({id,blob});
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
      });
    }
  }
}
async function putPhotoOptimized(id,blob){
  if(!blob) throw new Error('Empty photograph.');

async function putPhotoBlob(id,blob){

}
async function getPhotoBlob(id){

  });
}
async function deletePhotoBlob(id){
  if(!id)return;
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE,"readwrite");
    tx.objectStore(PHOTO_STORE).delete(id);
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
}
function releaseURL(id){
  const u=photoURLs.get(id);
  if(u){URL.revokeObjectURL(u);photoURLs.delete(id);}
}
async function photoURL(id){
  if(!id)return "";
  if(photoURLs.has(id))return photoURLs.get(id);
  // iPhone/Safari fallback: photographs may be stored directly in the inspection state
  // as compressed JPEG data URLs. This avoids relying on IndexedDB Blob transactions.
  for(const it of Object.values(state.items||{})){
    for(const p of (Array.isArray(it.photos)?it.photos:[])){
      if(p && p.id===id && p.src && String(p.src).startsWith("data:image/")) return p.src;
    }
  }
  if(state.meta?.vesselPhoto?.id===id && state.meta.vesselPhoto.src) return state.meta.vesselPhoto.src;
  const blob=await getPhotoBlob(id).catch(()=>null);
  if(!blob)return "";
  const u=URL.createObjectURL(blob);
  photoURLs.set(id,u);
  return u;
}

/* Migration from previous versions, including base64 photos */
async function migrate(d){
  const out=JSON.parse(JSON.stringify(d||{}));
  out.meta=Object.assign({},state.meta,out.meta||{});
  out.sectionStatus=Object.assign({},state.sectionStatus||{},out.sectionStatus||{});
  out.items=out.items||{};

  /* FIXED18: Section 7 combines legacy items 7.7 (Oily Water Separator) and
     7.8 (15 ppm Alarm Arrangements) into one item 7.7, then renumbers the
     following Engine Room items. Preserve existing inspection data. */
  {
    const mergeItemData=(a,b)=>{
      if(!a) return b ? JSON.parse(JSON.stringify(b)) : null;
      if(!b) return JSON.parse(JSON.stringify(a));
      const merged=JSON.parse(JSON.stringify(a));
      const ca=String(a.comments||'').trim();
      const cb=String(b.comments||'').trim();
      if(ca && cb && ca!==cb) merged.comments=ca+'\n\n'+cb;
      else merged.comments=ca||cb;
      merged.findings=[String(merged.comments||'')];
      const ra=Array.isArray(a.recommendations)?a.recommendations:[];
      const rb=Array.isArray(b.recommendations)?b.recommendations:[];
      merged.recommendations=[...ra,...rb].map(r=>({reference:String(r?.reference||''),status:String(r?.status||r?.recommendationStatus||'OPEN'),action:String(r?.action||''),completion:String(r?.completion||'')}));
      if(!merged.recommendations.length){
        const legacy=[a,b].map(x=>({reference:String(x?.reference||''),status:String(x?.recommendationStatus||'OPEN'),action:String(x?.action||''),completion:String(x?.completion||'')}));
        merged.recommendations=legacy;
      }
      return merged;
    };
    const old77=out.items['7.7'], old78=out.items['7.8'];
    if(old77 || old78) out.items['7.7']=mergeItemData(old77,old78);
    const renumber={
      '7.9':'7.8','7.10':'7.9','7.11':'7.10','7.12':'7.11','7.13':'7.12',
      '7.14':'7.13','7.15':'7.14','7.16':'7.15','7.17':'7.16','7.18':'7.17'
    };
    Object.entries(renumber).forEach(([from,to])=>{
      if(out.items[from]){ out.items[to]=out.items[from]; out.items[to].id=to; }
    });
    Object.keys(renumber).forEach(from=>{ delete out.items[from]; });
    /* Legacy 7.8 was merged into new 7.7 before the renumbering above. */
  }

  for(const s of checklist){
    for(const x of s.items){
      const old=out.items[x[0]];
      if(!old){
        out.items[x[0]]={
          id:x[0],text:x[1],guidance:x[2],status:"",comments:"",findings:[""],
          recommendations:[{reference:"",status:"OPEN",action:"",completion:""}],
          reference:"",action:"",recommendationStatus:"OPEN",completion:"",photos:[]
        };
        continue;
      }
      old.id=x[0];old.text=x[1];old.guidance=x[2];
      old.disabled=old.disabled===true;
      /* FIXED16 data model: one Finding / Comment per item, with multiple Recommendations.
         Preserve all legacy FIXED15 data by collapsing legacy multiple findings into one comment
         and moving the old recommendation fields into Recommendation 1. */
      if(!Array.isArray(old.findings)){ old.findings=[String(old.comments||"")]; }
      old.findings=old.findings.map(v=>String(v??""));
      if(!String(old.comments||"").trim()) old.comments=old.findings.filter(v=>v.trim()).join("\n\n");
      old.findings=[String(old.comments||"")];

      const legacyRec={
        reference:String(old.reference||""),
        status:String(old.recommendationStatus||"OPEN"),
        action:String(old.action||""),
        completion:String(old.completion||"")
      };
      if(legacyRec.status==="PENDING"||legacyRec.status==="FOLLOW-UP REQUIRED") legacyRec.status="OPEN";
      if(!Array.isArray(old.recommendations)||!old.recommendations.length){
        old.recommendations=[legacyRec];
      }else{
        old.recommendations=old.recommendations.map(r=>({
          reference:String(r?.reference||""),
          status:String(r?.status||r?.recommendationStatus||"OPEN"),
          action:String(r?.action||""),
          completion:String(r?.completion||"")
        }));
        if(!old.recommendations.length) old.recommendations=[legacyRec];
      }
      old.recommendations.forEach(r=>{if(r.status==="PENDING"||r.status==="FOLLOW-UP REQUIRED")r.status="OPEN";});
      /* Keep legacy scalar fields synchronized for compatibility with older JSON files. */
      const r0=old.recommendations[0]||legacyRec;
      old.reference=r0.reference; old.action=r0.action; old.recommendationStatus=r0.status; old.completion=r0.completion;
      old.photos=Array.isArray(old.photos)?old.photos:[];

      if(old.photo && !old.photos.length){
        old.photos=[{id:uid(),src:old.photo,description:"",location:"",
          format:out.meta.photoFormat||"A6",orientation:out.meta.photoOrientation||"auto"}];
      }

      const newPhotos=[];
      for(const p0 of old.photos){
        const p=typeof p0==="string"
          ? {id:uid(),src:p0,description:"",location:"",format:out.meta.photoFormat||"A6",orientation:out.meta.photoOrientation||"auto"}
          : Object.assign({id:uid(),description:"",location:"",format:out.meta.photoFormat||"A6",orientation:out.meta.photoOrientation||"auto"},p0);

        if(p.src && !p.blobStored){
          try{
            const blob=await dataURLToBlob(p.src);
            await putPhotoBlob(p.id,blob);
            delete p.src;
            p.blobStored=true;
          }catch(e){
            /* Never write legacy base64 back into persistent state after a failed migration. */
            delete p.src;
            p.blobStored=false;
            p.storageError=true;
          }
        }
        newPhotos.push(p);
      }
      old.photos=newPhotos;
      delete old.photo;
    }
  }

  /* Legacy vessel photo */
  if(out.meta.vesselPhoto?.src && !out.meta.vesselPhoto.blobStored){
    try{
      const id=out.meta.vesselPhoto.id||uid();
      await putPhotoBlob(id,await dataURLToBlob(out.meta.vesselPhoto.src));
      out.meta.vesselPhoto={id,description:out.meta.vesselPhoto.description||"",blobStored:true};
    }catch(e){}
  }
  return out;
}
function dataURLToBlob(dataURL){
  return new Promise((resolve,reject)=>{
    try{
      const parts=dataURL.split(",");
      const mime=(parts[0].match(/:(.*?);/)||[])[1]||"image/jpeg";
      const bin=atob(parts[1]);
      const arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
      resolve(new Blob([arr],{type:mime}));
    }catch(e){reject(e)}
  });
}

      await saveStateDB();
      try{oldDb.close()}catch(e){}
      try{indexedDB.deleteDatabase(LEGACY_DB_NAME)}catch(e){}
      return true;
    }
    try{oldDb.close()}catch(e){}
    try{indexedDB.deleteDatabase(LEGACY_DB_NAME)}catch(e){}
  }catch(e){console.warn("Legacy IndexedDB migration failed",e)}

  /* Migrate the original localStorage backup if present. */
  try{

    if(!raw)return false;
    state=await migrate(JSON.parse(raw));
    initItems();
    await saveStateDB();
    try{localStorage.removeItem(LEGACY_STORAGE_KEY)}catch(e){}
    return true;
  }catch(e){
    console.warn("Legacy localStorage migration failed",e);
    return false;
  }
}

async function deleteDatabaseAsync(name){

async function clearInspectionStorage(){
  // Stop any pending autosave before deleting the current inspection.
  clearTimeout(saveTimer);
  saveTimer=null;
  try{await saveChain}catch(e){}

  try{
    const db=await openPhotoDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction([STATE_STORE,PHOTO_STORE],"readwrite");
      tx.objectStore(STATE_STORE).clear();
      tx.objectStore(PHOTO_STORE).clear();
      tx.oncomplete=resolve;
      tx.onerror=()=>reject(tx.error||new Error("IndexedDB clear failed"));
      tx.onabort=()=>reject(tx.error||new Error("IndexedDB clear aborted"));
    });
    try{db.close()}catch(e){}
    dbPromise=null;
  }catch(e){
    console.warn("Current inspection storage clear failed",e);
    throw e;
  }

  try{localStorage.removeItem(LEGACY_STORAGE_KEY)}catch(e){}
  await deleteDatabaseAsync(LEGACY_DB_NAME);
}

/* ---------- Item photograph capture / upload ---------- */
function compressImage(file,maxSide=1280,quality=.62){
  return new Promise((resolve,reject)=>{
    if(!file || !String(file.type||'').startsWith('image/')){reject(new Error('Selected file is not an image.'));return;}
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h)throw new Error('Image dimensions unavailable.');
        const scale=Math.min(1,maxSide/Math.max(w,h));
        const cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
        const canvas=document.createElement('canvas');
        canvas.width=cw;canvas.height=ch;
        const ctx=canvas.getContext('2d',{alpha:false});
        if(!ctx)throw new Error('Canvas is unavailable.');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,cw,ch);
        canvas.toBlob(blob=>{
          URL.revokeObjectURL(url);
          if(!blob){reject(new Error('Image conversion failed.'));return;}
          resolve({blob,width:cw,height:ch});
        },'image/jpeg',quality);
      }catch(err){URL.revokeObjectURL(url);reject(err)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('The selected image cannot be read by Safari.'))};
    img.src=url;
  });
}

function triggerItemPhoto(itemId,takePhoto){
  const input=document.getElementById('photoInput-'+itemId);
  if(!input)return;
  input.accept='image/*';

  else input.removeAttribute('capture');

async function handleItemPhotoFiles(itemId,fileList){
  const it=state.items[itemId];
  if(!it || !fileList || !fileList.length)return;
  const files=Array.from(fileList);
  try{
    for(const f of files){
      let result;
      try{ result=await compressImage(f,800,.48); }
      catch(firstErr){
        // Last-resort read path for Safari camera/Photos results.
        result=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>{
            const src=String(reader.result||'');
            if(!src.startsWith('data:image/')){reject(new Error('Safari returned an unreadable image.'));return;}
            resolve({dataURL:src,width:0,height:0});
          };
          reader.onerror=()=>reject(reader.error||new Error('Photo file could not be read.'));
          reader.readAsDataURL(f);
        });
      }
      const id=uid();
      let src=result.dataURL;
      if(!src){
        src=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(String(reader.result||''));
          reader.onerror=()=>reject(reader.error||new Error('Photo conversion failed.'));
          reader.readAsDataURL(result.blob);
        });
      }
      if(!src || !src.startsWith('data:image/')) throw new Error('Photo data was not produced.');
      // Store the compressed image directly in state. This is intentionally used
      // for the iPhone prototype because it is more reliable than IndexedDB Blob
      // storage on some Safari/iOS configurations.
      it.photos.push({
        id, src, description:'', location:'',
        format:state.meta.photoFormat||'A6',
        orientation:state.meta.photoOrientation||'auto',
        width:result.width||0, height:result.height||0, blobStored:false
      });
    }
    await saveNow(false);
    const box=document.getElementById('photos-'+itemId);
    if(box)box.innerHTML=await renderPhotoEditors(it);
    updateReferenceSuggestion(itemId);
  }catch(err){
    console.error('Item photograph error:',err);
    alert('Photograph could not be added. '+(err&&err.message?err.message:'Please try again or select a different image.'));
  }
}
async function updatePhoto(itemId,index,key,value){
  const it=state.items[itemId];
  if(!it || !it.photos[index])return;
  it.photos[index][key]=value;
  saveStateQuiet();
}

async function deletePhoto(itemId,index){
  const it=state.items[itemId];
  if(!it || !it.photos[index])return;
  if(!confirm('Delete this photograph?'))return;
  const p=it.photos[index];
  try{await deletePhotoBlob(p.id)}catch(e){console.warn('Photo delete failed',e)}
  releaseURL(p.id);
  it.photos.splice(index,1);
  await saveNow(false);
  const box=document.getElementById('photos-'+itemId);
  if(box)box.innerHTML=await renderPhotoEditors(it);
}

function showPage(page){
  currentPage=String(page);
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",String(b.dataset.page)===String(page)));
  if(page==="cover") renderCover();
  else if(page==="reference-library") renderReferenceLibrary();
  else if(page==="review") renderReview();
  else renderSection(Number(page));
  window.scrollTo({top:0,behavior:"smooth"});
}
function getSectionStatus(s){
  const forced=state.sectionStatus?.[String(s.no)];
  if(forced==='N/A') return {type:'na',symbol:'N/A',label:'N/A'};
  const items=s.items.map(x=>state.items[x[0]]).filter(Boolean).filter(it=>it.disabled!==true);
  const assessed=items.filter(it=>it.status);
  if(items.length===0) return {type:'done',symbol:'✓',label:'Completed'};
  if(assessed.length===0) return {type:'none',symbol:'—',label:'Not started'};
  if(assessed.length===items.length) return {type:'done',symbol:'✓',label:'Completed'};
  return {type:'attention',symbol:'⚠',label:'Attention'};
}
function renderSectionStatusSummary(){
  const total=checklist.length;
  let completed=0,attention=0,none=0,na=0;
  checklist.forEach(s=>{const st=getSectionStatus(s); if(st.type==='done')completed++; else if(st.type==='attention')attention++; else if(st.type==='none')none++; else if(st.type==='na')na++;});
  const el=document.getElementById('navSummary');
  if(el) el.innerHTML=`<div><b>Sections completed:</b> ${completed} / ${total}</div><div><b>Attention required:</b> ${attention}</div><div><b>Not started:</b> ${none}</div><div><b>N/A:</b> ${na}</div>`;
}
function updateProgress(){
  const all=Object.values(state.items||{});
  const applicable=checklist.flatMap(s=>s.items.map(x=>state.items[x[0]])).filter(Boolean).filter(it=>it.disabled!==true).filter(it=>getSectionStatus(checklist.find(s=>s.items.some(x=>x[0]===it.id)))?.type!=='na');
  const assessed=applicable.filter(it=>it.status).length;
  const total=applicable.length;
  const bar=document.getElementById('progressBar'); if(bar) bar.style.width=(total?Math.round(assessed/total*100):0)+'%';
  const txt=document.getElementById('progressText'); if(txt) txt.textContent=`${assessed} / ${total} items assessed`;
  renderNavStatuses();
}
function renderNavStatuses(){
  checklist.forEach(s=>{
    const b=document.querySelector(`.navbtn[data-page="${s.no}"]`);
    if(!b)return;
    const st=getSectionStatus(s);

document.addEventListener("click",e=>{

function normalizeReferenceText(v){
  return String(v||"").toLowerCase()
    .replace(/&/g," and ")
    .replace(/[^a-z0-9а-яё\s.-]/gi," ")
    .replace(/\s+/g," ").trim();
}
function csvTerms(v){return String(v||"").split(",").map(normalizeReferenceText).filter(x=>x.length>=2)}
function csvIds(v){return String(v||"").split(",").map(x=>String(x).trim()).filter(Boolean)}
function getReferenceLibrary(){
  try{
    const raw=localStorage.getItem(REFERENCE_LIBRARY_KEY);
    if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed)&&parsed.length)return parsed;}
  }catch(e){console.warn("Reference Library read failed",e)}
  return JSON.parse(JSON.stringify(DEFAULT_REFERENCE_LIBRARY));
}
function saveReferenceLibrary(lib){try{localStorage.setItem(REFERENCE_LIBRARY_KEY,JSON.stringify(lib));return true}catch(e){console.warn("Reference Library save failed",e);return false}}
function referenceTermMatch(hay,term){
  if(!hay||!term)return false;
  if(term.includes(" ")) return hay.includes(term);
  try{return new RegExp("(^|\\s)"+term.replace(/[.*+?^${}()|[\\]\\]/g,"\\$&")+"(?=\\s|$)","i").test(hay)}catch(e){return hay.includes(term)}
}
function getItemSectionId(item){
  const found=checklist.find(s=>s.items.some(x=>x[0]===item.id));
  return found?String(found.no):"";
}
function scoreReferenceEntry(entry,item){
  const comments=normalizeReferenceText(item.comments), itemText=normalizeReferenceText(item.text), sectionId=getItemSectionId(item);
  if(!(comments||itemText))return {score:0,matches:[],excluded:false};
  const exclusions=csvTerms(entry.exclusionKeywords);
  if(exclusions.some(t=>referenceTermMatch(comments,t)))return {score:-999,matches:[],excluded:true};
  let score=Number(entry.priority)||0, matches=[];
  const sections=csvIds(entry.sectionIds), items=csvIds(entry.itemIds);
  if(items.includes(String(item.id)))score+=40;
  if(sections.includes(sectionId))score+=15;
  for(const term of csvTerms(entry.keywords)){
    const inC=referenceTermMatch(comments,term), inI=referenceTermMatch(itemText,term);
    if(inC){const n=term.split(" ").length;score+=n>=3?25:n===2?15:8;matches.push(term)}
    else if(inI){score+=nudge=3;}
  }
  return {score,matches,excluded:false};
}
function findReferenceMatches(it){
  if(!it||!(it.status==="Observation"||it.status==="Deficiency"))return [];
  if(normalizeReferenceText(it.comments).length<3)return [];
  return getReferenceLibrary().map(e=>{const r=scoreReferenceEntry(e,it);return Object.assign({},e,r)}).filter(x=>x.score>0&&!x.excluded).sort((a,b)=>b.score-a.score).slice(0,5);
}
function referenceSuggestionHTML(id,matches,it){
  if(!matches.length)return '<span>No confident library match found. Enter the applicable reference manually or refine the library.</span>';
  const best=matches[0], second=matches[1], confident=best.score>=35 && (!second || best.score-second.score>=8);
  const matchText=best.matches.slice(0,5).join(", ")||"section/item context";
  return `<strong>${confident&&!it.reference?"Auto-detected":"Suggested by Reference Library"}:</strong> ${escapeHTML(best.reference)} <span class="reference-match">Score: ${Math.round(best.score)}; matched: ${escapeHTML(matchText)}</span> <button type="button" class="btn" style="padding:4px 7px;margin-left:6px" onclick="applyReferenceSuggestion('${id}')">Use</button>`;
}
function updateReferenceSuggestion(id){
  const it=state.items[id],box=document.getElementById("reference-suggestion-"+id);if(!box||!it)return;
  if(!(it.status==="Observation"||it.status==="Deficiency")){box.innerHTML="";return}
  const matches=findReferenceMatches(it),best=matches[0],second=matches[1];
  if(!matches.length){box.innerHTML=referenceSuggestionHTML(id,[],it);return}
  const confident=best.score>=35 && (!second||best.score-second.score>=8);
  if(!it.reference&&confident){it.reference=best.reference;const input=document.getElementById("reference-"+id);if(input)input.value=best.reference;box.innerHTML=referenceSuggestionHTML(id,matches,it);saveStateQuiet();return}
  box.innerHTML=referenceSuggestionHTML(id,matches,it);
}
function applyReferenceSuggestion(id){const it=state.items[id];if(!it)return;const m=findReferenceMatches(it)[0];if(!m)return;it.reference=m.reference;const input=document.getElementById("reference-"+id);if(input)input.value=m.reference;saveStateQuiet();updateReferenceSuggestion(id)}
function detectReferenceNow(id){
  const it=state.items[id];if(!it||!(it.status==="Observation"||it.status==="Deficiency")){alert("Set Status to Observation or Deficiency first.");return}
  const m=findReferenceMatches(it)[0];if(!m){alert("No Reference Library match was found from Comments / Findings.");updateReferenceSuggestion(id);return}
  it.reference=m.reference;const input=document.getElementById("reference-"+id);if(input)input.value=m.reference;saveStateQuiet();updateReferenceSuggestion(id)
}

  <div class="card">
    <h2>Final Review / Recommendations</h2>
    <div class="notice">Each inspection item has one Finding / Comment and may contain multiple separate Recommendations.</div>
    <div class="table-wrap"><table>
      <thead><tr><th>No.</th><th>Section / Item</th><th>Finding / Observation</th><th>Reference</th><th>Recommended Corrective Action</th><th>Status</th><th>Completion / Verification</th></tr></thead>
      <tbody>${recRows.map((x,i)=>`<tr><td>${i+1}</td><td>${escapeHTML(x.it.id)} — ${escapeHTML(x.it.text)}<br><span class="small">Recommendation ${x.ri+1}</span></td><td>${escapeHTML(x.it.comments||"")}</td><td>${escapeHTML(x.r.reference||"")}</td><td>${escapeHTML(x.r.action||"")}</td><td>${escapeHTML(x.r.status||"")}</td><td>${escapeHTML(x.r.completion||"")}</td></tr>`).join("")||`<tr><td colspan="7">No Observation / Deficiency / Recommendation items recorded.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

/* ---------- PDF / print ---------- */
async function buildPrintReport(){
  const m=state.meta||{};
  const allItems=Object.values(state.items||{}).filter(x=>!itemSectionIsNA(x.id)&&!itemIsDisabled(x.id));
  const assessed=allItems.filter(x=>x.status);
  const satisfactory=allItems.filter(x=>x.status==='Satisfactory');
  const observations=allItems.filter(x=>x.status==='Observation');
  const deficiencies=allItems.filter(x=>x.status==='Deficiency');
  const naItems=allItems.filter(x=>x.status==='N/A');
  const recommendations=allItems.filter(x=>x.status==='Observation'||x.status==='Deficiency'||x.recommendationStatus==='RECOMMENDATION');
  let totalPhotoCount=0;
  for(const s of checklist) {
    if(state.sectionStatus?.[String(s.no)]==='N/A') continue;
    for(const x of s.items){ const it=state.items[x[0]]; if(it&&Array.isArray(it.photos)) totalPhotoCount+=it.photos.length; }
  }

  /*
    Safari/WebKit does not reliably repeat fixed-position elements or a tfoot
    used as a global print footer. Therefore the report is deliberately built
    as a sequence of self-contained A4 pages. Every page contains its own
    header and footer, including the page number. This is reliable in Safari,
    Chrome and Edge and keeps the report fully offline.
  */
  const pageHeader=()=>`<div class="report-page-header"><div class="report-header-name">INTERCREWING LTD</div></div>`;
  const pageFooter=(pageNo)=>`<div class="report-page-footer">
    <div class="report-footer-left">
      <div class="report-footer-code">002 QHSE&nbsp;&nbsp;&nbsp;&nbsp;Rev 01/Sept.,2026</div>
      <div class="report-footer-note">The form is used for QHSE shipboard audit.</div>
    </div>
    <div class="report-footer-page">Page ${pageNo}</div>
  </div>`;
  const makePage=(body,options={})=>{
    const noHeader=options.noHeader===true;
    return `<div class="report-page${noHeader?' cover-report-page':''}">${noHeader?'':pageHeader()}<div class="report-page-body">${body}</div>${pageFooter('__PAGE__')}</div>`;
  };

  const pages=[];

  /* ---------- Page 1: Inspection Summary ---------- */
  const coverOrientation=((m.coverPhotoOrientation||'auto')==='portrait'?'portrait':((m.coverPhotoOrientation||'auto')==='landscape'?'landscape':((m.vesselPhoto?.width||0)>=(m.vesselPhoto?.height||0)?'landscape':'portrait')));
  const coverPhotoHTML=m.vesselPhoto?.id
    ? `<div class="inspection-summary-photo ${coverOrientation}"><img src="${await photoURL(m.vesselPhoto.id)}" alt="Vessel photograph"></div>`
    : `<div class="inspection-summary-photo"><div class="inspection-summary-photo-empty">No vessel photograph available.</div></div>`;
  pages.push(makePage(`<div class="inspection-summary-cover">
    <div class="inspection-summary-title">INSPECTION SUMMARY</div>
    <div class="inspection-summary-top">
      ${coverPhotoHTML}
      <div class="inspection-summary-facts">
        <div class="summary-fact"><span class="summary-fact-label">VESSEL</span><span class="summary-fact-value">${escapeHTML(m.vesselName||'')}</span></div>
        <div class="summary-fact"><span class="summary-fact-label">DATE OF INSPECTION</span><span class="summary-fact-value">${escapeHTML(m.inspectionDate||'')}</span></div>
        <div class="summary-fact"><span class="summary-fact-label">PORT OF INSPECTION</span><span class="summary-fact-value">${escapeHTML(m.inspectionPort||'')}</span></div>
      </div>
    </div>
    <div class="inspection-summary-lower">
      <div class="summary-text-block">
        <div class="summary-text-heading"><span>DESCRIPTION OF THE AUDIT</span></div>
        <div class="summary-text">${escapeHTML(m.auditDescription||'')}</div>
      </div>
      <div class="summary-text-block">
        <div class="summary-text-heading"><span>CONCLUSION</span></div>
        <div class="summary-text">${escapeHTML(m.conclusion||'')}</div>
      </div>
    </div>
  </div>`,{noHeader:true}));

  /* ---------- Page 2: Vessel & Crew Information ---------- */
  pages.push(makePage(`<div class="vessel-crew-info-page">
    <div class="report-page-title">VESSEL &amp; CREW INFORMATION</div>

    <div class="info-block">
      <div class="info-block-title">VESSEL INFORMATION</div>
      <table class="info-table vessel-info-table"><tbody>
        <tr><th>Vessel Name</th><td>${escapeHTML(m.vesselName||'')}</td></tr>
        <tr><th>IMO Number</th><td>${escapeHTML(m.imo||'')}</td></tr>
        <tr><th>Ship Type</th><td>${escapeHTML(m.shipType||'')}</td></tr>
        <tr><th>Flag</th><td>${escapeHTML(m.flag||'')}</td></tr>
        <tr><th>Port of Registry</th><td>${escapeHTML(m.portOfRegistry||'')}</td></tr>
        <tr><th>Classification Society</th><td>${escapeHTML(m.classSociety||'')}</td></tr>
        <tr><th>Registered Owner</th><td>${escapeHTML(m.registeredOwner||'')}</td></tr>
        <tr><th>Technical Manager</th><td>${escapeHTML(m.technicalManager||'')}</td></tr>
      </tbody></table>
    </div>

    <div class="info-block">
      <div class="info-block-title">SHIP PARTICULARS</div>
      <table class="info-table particulars-table"><tbody>
        <tr><th>Shipbuilder</th><td>${escapeHTML(m.shipbuilder||'')}</td><th>Delivery Date</th><td>${escapeHTML(m.deliveryDate||'')}</td></tr>
        <tr><th>Deadweight (DWT)</th><td>${escapeHTML(m.dwt||'')}</td><th>Gross Tonnage</th><td>${escapeHTML(m.gt||'')}</td></tr>
        <tr><th>Net Tonnage</th><td>${escapeHTML(m.nt||'')}</td><th>Length Overall (LOA)</th><td>${escapeHTML(m.loa||'')}</td></tr>
        <tr><th>Breadth</th><td>${escapeHTML(m.breadth||'')}</td><th>Depth</th><td>${escapeHTML(m.depth||'')}</td></tr>
        <tr><th>Summer Draught</th><td>${escapeHTML(m.summerDraught||'')}</td><th></th><td></td></tr>
      </tbody></table>
    </div>

    <div class="info-block">
      <div class="info-block-title">CREW INFORMATION</div>
      <table class="info-table crew-table"><thead><tr><th>POSITION</th><th>NAME</th></tr></thead><tbody>
        <tr><th>Master</th><td>${escapeHTML(m.master||'')}</td></tr>
        <tr><th>Chief Officer</th><td>${escapeHTML(m.chiefOfficer||'')}</td></tr>
        <tr><th>Chief Engineer</th><td>${escapeHTML(m.chiefEngineer||'')}</td></tr>
        <tr><th>2nd Engineer</th><td>${escapeHTML(m.secondEngineer||'')}</td></tr>
        <tr><th>Crew Nationality</th><td>${escapeHTML(m.crewNationality||'')}</td></tr>
      </tbody></table>
    </div>
  </div>`));

  /* Photo positions are relative to the 194 x 272 mm printable body area
     between the report header and footer. This prevents photo cards from
     overflowing the self-contained A4 page and generating blank pages. */
  const positions={
    A5:[['4mm','4mm','186mm','130mm'],['4mm','138mm','186mm','130mm']],
    A6:[['4mm','4mm','91mm','130mm'],['99mm','4mm','91mm','130mm'],['4mm','138mm','91mm','130mm'],['99mm','138mm','91mm','130mm']]
  };
  let pno=1;

  /* Estimate row height so long comments do not create an oversized page.
     The estimate is intentionally conservative for 11 pt report text. */
  const rowWeight=(it)=>{
    const recText=(it?.recommendations||[]).map(r=>[r.reference,r.action,r.status,r.completion].filter(Boolean).join(' ')).join(' ');
    const text=[it?.text,it?.comments,recText].filter(Boolean).join(' ');
    return Math.max(1,Math.ceil(text.length/150));
  };

  /* ---------- Sections: checklist page(s), then that section's photographs ---------- */
  for(const s of checklist){
    if(state.sectionStatus?.[String(s.no)]==='N/A') continue;
    const rows=s.items.filter(x=>!itemIsDisabled(x[0])).map(x=>{
      const it=state.items[x[0]]||{};
      const commentParts=[];
      if(it.status) commentParts.push(`<strong>Status:</strong> ${escapeHTML(it.status)}`);
      if(String(it.comments||'').trim()) commentParts.push(`<strong>Finding / Comment:</strong> ${escapeHTML(it.comments)}`);
      const recs=Array.isArray(it.recommendations)&&it.recommendations.length?it.recommendations:[];
      recs.forEach((r,i)=>{
        const parts=[];
        if(String(r.reference||'').trim()) parts.push(`<strong>Reference:</strong> ${escapeHTML(r.reference)}`);
        if(String(r.status||'').trim()) parts.push(`<strong>Recommendation Status:</strong> ${escapeHTML(r.status)}`);
        if(String(r.action||'').trim()) parts.push(`<strong>Recommended Corrective Action:</strong> ${escapeHTML(r.action)}`);
        if(String(r.completion||'').trim()) parts.push(`<strong>Completion / Verification Remarks:</strong> ${escapeHTML(r.completion)}`);
        if(parts.length) commentParts.push(`<strong>Recommendation ${i+1}</strong><br>${parts.join('<br>')}`);
      });
      return {html:`<tr><td>${escapeHTML(it.id||x[0])}</td><td>${escapeHTML(it.text||x[1]||'')}</td><td>${commentParts.join('<br><br>')}</td></tr>`,weight:rowWeight(it)};
    });

    let batch=[];
    let weight=0;
    const flushSectionPage=()=>{
      if(!batch.length)return;
      pages.push(makePage(`<div class="section-print section-page">
        <div class="print-section-header"><h2>SECTION ${s.no} — ${escapeHTML(s.title)}</h2></div>
        <table class="print-table section-checklist-table"><thead><tr>
          <th>N</th><th>Item</th><th>Comments or/and Findings (reference for recommendation, observation, defect, NCR etc. if applicable)</th>
        </tr></thead><tbody>${batch.map(r=>r.html).join('')}</tbody></table>
      </div>`));
      batch=[]; weight=0;
    };
    for(const r of rows){
      if(batch.length && weight+r.weight>12) flushSectionPage();
      batch.push(r); weight+=r.weight;
    }
    flushSectionPage();

    const photos=[];
    for(const x of s.items){
      const it=state.items[x[0]];
      if(!it||it.disabled===true||!Array.isArray(it.photos)) continue;
      for(const p of it.photos){
        const u=await photoURL(p.id);
        if(u) photos.push({...p,src:u,sectionNo:s.no,sectionTitle:s.title,itemId:it.id,itemText:it.text});
      }
    }

    let pi=0;
    while(pi<photos.length){
      const fmt=photos[pi].format==='A5'?'A5':'A6';
      const per=fmt==='A5'?2:4;
      let end=pi;
      while(end<photos.length && (photos[end].format==='A5'?'A5':'A6')===fmt && end-pi<per) end++;
      const chunk=photos.slice(pi,end);
      pages.push(makePage(`<div class="section-photo-block"><div class="photo-sheet ${fmt.toLowerCase()}">${chunk.map((p,j)=>{
        const q=positions[fmt][j], n=pno+j;
        return `<div class="photo-card-abs" style="left:${q[0]};top:${q[1]};width:${q[2]};height:${q[3]};">
          <div class="photo-image-abs"><img src="${p.src}" alt="Photo ${n}"></div>
          <div class="photo-caption-abs"><strong>Photo No.:</strong> ${n}<br><strong>Section:</strong> ${escapeHTML(p.sectionNo||'')}. ${escapeHTML(p.sectionTitle||'')}<br><strong>Item:</strong> ${escapeHTML(p.itemId||'')} — ${escapeHTML(p.itemText||'')}<br><strong>Description:</strong> ${escapeHTML(p.description||'')}</div>
        </div>`;
      }).join('')}</div></div>`));
      pno+=chunk.length;
      pi=end;
    }
  }

  /* ---------- Final findings / recommendations ---------- */
  if(recommendations.length){
    let batch=[];
    let weight=0;
    const flushRecPage=()=>{
      if(!batch.length)return;
      pages.push(makePage(`<div class="section-print section-page final-recommendations-page">
        <div class="print-section-header"><h2>FINAL FINDINGS &amp; RECOMMENDATIONS</h2></div>
        <table class="print-table final-recommendations-table"><thead><tr><th>No.</th><th>Section / Item</th><th>Finding / Observation</th><th>Reference</th><th>Recommended Corrective Action</th><th>Status</th><th>Completion / Verification</th></tr></thead><tbody>${batch.map(x=>x.html).join('')}</tbody></table>
      </div>`));
      batch=[]; weight=0;
    };
    let recNo=0;
    /* Estimate physical row height by the widest/most line-intensive cell,
       rather than using total character count. This allows several normal
       recommendations to remain together in the same table page. */
    const recRowWeight=(it,r)=>{
      const cells=[
        String(it.id||''),
        String(it.text||''),
        String(it.comments||''),
        String(r.reference||''),
        String(r.action||''),
        String(r.status||''),
        String(r.completion||'')
      ];
      const capacities=[8,24,28,18,27,12,26];
      const lines=cells.map((v,i)=>Math.max(1,Math.ceil(v.length/capacities[i])));
      return Math.max(2,...lines)+1;
    };
    recommendations.forEach((it)=>{
      const recs=Array.isArray(it.recommendations)&&it.recommendations.length?it.recommendations:[{reference:it.reference||"",status:it.recommendationStatus||"OPEN",action:it.action||"",completion:it.completion||""}];
      recs.forEach((r,ri)=>{
        recNo++;
        const finding=String(it.comments||'');
        const weightThis=recRowWeight(it,r);
        const row={weight:weightThis,html:`<tr><td>${recNo}</td><td><strong>${escapeHTML(it.id||'')}</strong><br>${escapeHTML(it.text||'')}<br><span style="font-size:7pt">Recommendation ${ri+1}</span></td><td>${escapeHTML(finding)}</td><td>${escapeHTML(r.reference||'')}</td><td>${escapeHTML(r.action||'')}</td><td>${escapeHTML(r.status||'')}</td><td>${escapeHTML(r.completion||'')}</td></tr>`};
        /* Approx. 24 line-units fit comfortably in the printable body with
           the compact final table typography. A single unusually long row is
           still allowed to occupy its own page. */
        if(batch.length && weight+row.weight>24) flushRecPage();
        batch.push(row); weight+=row.weight;
      });
    });
    flushRecPage();
  }else{
    pages.push(makePage(`<div class="section-print section-page final-recommendations-page">
      <div class="print-section-header"><h2>FINAL FINDINGS &amp; RECOMMENDATIONS</h2></div>
      <table class="print-table final-recommendations-table"><thead><tr><th>No.</th><th>Section / Item</th><th>Finding / Observation</th><th>Reference</th><th>Recommended Corrective Action</th><th>Status</th><th>Completion / Verification</th></tr></thead><tbody><tr><td colspan="7">No Observation / Deficiency / Recommendation items recorded.</td></tr></tbody></table>
    </div>`));
  }

  const totalPages=pages.length;
  return `<div>${pages.map((page,i)=>page.replace('Page __PAGE__',`Page ${i+1} of ${totalPages}`)).join('')}</div>`;
}

async function printReport(){
  try{
    if(!state || !state.meta){
      alert('Start or load an inspection before creating the report.');
      return;
    }
    await saveNow(false);
    const report=await buildPrintReport();
    const el=document.getElementById('printReport');
    el.innerHTML=report;
    el.classList.add('print-ready');
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    window.print();
  }catch(err){
    console.error('Print report error:',err);
    alert('The report could not be generated. Check the browser console for details.');
  }
}

/* ---------- JSON export/import ---------- */
async function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);
  });
}
async function exportJSON(){
  const out=JSON.parse(JSON.stringify(state));
  out.referenceLibrary=getReferenceLibrary();
  for(const it of Object.values(out.items)){
    for(const p of it.photos){
      const blob=await getPhotoBlob(p.id);
      if(blob)p.src=await blobToDataURL(blob);
      delete p.blobStored;
    }
  }
  if(out.meta.vesselPhoto?.id){
    const blob=await getPhotoBlob(out.meta.vesselPhoto.id);
    if(blob)out.meta.vesselPhoto.src=await blobToDataURL(blob);
    delete out.meta.vesselPhoto.blobStored;
  }
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(state.meta.vesselName||"inspection").replace(/[^\w\-]+/g,"_")+"_inspection.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("importInput").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const imported=JSON.parse(r.result);
      if(Array.isArray(imported.referenceLibrary)) saveReferenceLibrary(imported.referenceLibrary);
      delete imported.referenceLibrary;
      state=await migrate(imported);
      initItems();await saveNow(false);startApp();
      alert("Inspection imported. Photographs were stored separately in IndexedDB.");
    }catch(err){console.error(err);alert("Invalid inspection JSON or photograph data.");}
  };
  r.readAsText(f);e.target.value="";
});

/* ---------- Cover camera ---------- */
document.getElementById("coverPhotoInput").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    let result=await compressImage(f);
    const id=uid();
    try{await putPhotoOptimized(id,result.blob)}catch(firstErr){
      result=await compressImage(f,900,.42);
      await putPhotoOptimized(id,result.blob);
    }
    if(state.meta.vesselPhoto?.id)await deletePhotoBlob(state.meta.vesselPhoto.id);
    state.meta.vesselPhoto={id,width:result.width,height:result.height,blobStored:true};
    await saveNow(false);await renderCover();
  }catch(err){alert("Vessel photograph could not be stored.");}
  e.target.value="";
});

/* ---------- iPhone / PWA offline readiness ---------- */
function setOfflineStatus(mode,text){
  const el=document.getElementById("offlineStatus");
  if(!el)return;
  el.className="offline-status "+(mode||"");
  el.textContent=text;
}
async function requestPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      const granted=await navigator.storage.persist();
      if(granted) console.info("Persistent browser storage granted.");
    }
  }catch(e){console.warn("Persistent storage request failed",e)}
}
async function updateOfflineStatus(){
  const online=navigator.onLine;
  if(!online){
    setOfflineStatus("offline","OFFLINE — local data active");
    return;
  }
  if("serviceWorker" in navigator){
    try{
      const reg=await navigator.serviceWorker.ready;
      const controlled=!!navigator.serviceWorker.controller;
      if(controlled || reg.active){
        setOfflineStatus("ready","ONLINE — offline mode ready");
      }else{
        setOfflineStatus("online","ONLINE — preparing offline mode");
      }
    }catch(e){setOfflineStatus("online","ONLINE")}
  }else{
    setOfflineStatus("online","ONLINE — PWA unavailable")
  }
}
window.addEventListener("online",updateOfflineStatus);
window.addEventListener("offline",updateOfflineStatus);
window.addEventListener("pageshow",()=>{updateOfflineStatus();requestPersistentStorage()});
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"});
      await navigator.serviceWorker.ready;
      await requestPersistentStorage();
      updateOfflineStatus();
      reg.update().catch(()=>{});
    }catch(err){
      console.warn("Service worker registration failed",err);
      setOfflineStatus(navigator.onLine?"online":"offline",navigator.onLine?"ONLINE — offline cache unavailable":"OFFLINE — local data active");
    }
  });
}
